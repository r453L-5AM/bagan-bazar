{% extends "base.html" %}{% block content %}<div class="page-title"><div class="container"><h1>Checkout</h1></div></div><div class="container detail-grid"><form class="form-card" method="post"><h2>Customer Information</h2><div class="field"><label>আপনার নাম *</label><input name="customer_name" required></div><div class="field"><label>মোবাইল নম্বর *</label><input name="phone" required inputmode="tel"></div><div class="field"><label>সম্পূর্ণ ঠিকানা *</label><textarea name="address" required></textarea></div><div class="field"><label>অতিরিক্ত নির্দেশনা (ঐচ্ছিক)</label><textarea name="note"></textarea></div><input type="hidden" name="cart_json" id="cartJson"><p class="muted">Payment: Cash on Delivery</p><button class="btn" type="submit">Place Order</button></form><div class="form-card"><h2>Your Order</h2><div id="checkoutCart"></div></div></div>{% endblock %}
