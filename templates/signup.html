{% extends "base.html" %}{% block content %}
<div class="page-title"><div class="container"><h1>Create Account</h1></div></div>
<div class="container"><form class="form-card auth-card" method="post" action="{{ url_for('signup') }}"><h2>Join BAGAN BAZAR</h2><p class="muted">Create your customer account</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ 'error' if category=='error' else '' }}">{{ message }}</div>{% endfor %}{% endwith %}
<div class="field"><label>Full Name</label><input name="name" autocomplete="name" required></div><div class="field"><label>Email Address</label><input type="email" name="email" autocomplete="email" required></div><div class="field"><label>Phone Number</label><input type="tel" name="phone" autocomplete="tel"></div><div class="field"><label>Password (minimum 8 characters)</label><input type="password" name="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>Confirm Password</label><input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></div><button class="btn" type="submit">Create Account</button><p class="muted">Already registered? <a class="auth-link" href="{{ url_for('customer_login') }}">Login</a></p></form></div>{% endblock %}
