{% extends "base.html" %}{% block content %}<div class="page-title"><div class="container"><h1>{{ product.name }}</h1></div></div><div class="container detail-grid"><div class="product-art product-detail-image" style="height:360px"><img src="{{ product.image if product.image and product.image.startswith('http') else url_for('static', filename='images/garden-fallback.svg') }}" alt="{{ product.name }}" onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/garden-fallback.svg') }}'"></div><div><p class="muted">{{ product.category_name }}</p><h1>{{ product.name }}</h1><p>{{ product.description }}</p><h2 class="price">{{ product.price|money }}</h2><p>স্টক: {{ product.stock }}</p><button class="btn" onclick='addToCart({{product.id|tojson}},{{product.name|tojson}},{{product.price|tojson}},{{product.image|tojson}})'>Add to Cart</button> <a class="btn outline" href="/checkout">Checkout</a></div></div>{% endblock %}
